# Physical verification on every push / PR: KLayout DRC and LVS (layout vs xschem schematic) per cell.
# Same container as cace.yml. NOT yet run on GitHub (see docs/cace_ci/STATUS.md); the commands are the ones run locally:
#   scripts/flow.sh <cell> --only drc,lvs   (= scripts/run_drc.sh + scripts/run_lvs.sh for the cells of cells.yaml)
name: verify

on:
  push:
    paths:
      - "gds/**"
      - "xschem/**"
      - "scripts/run_drc.sh"
      - "scripts/run_lvs.sh"
      - "scripts/flow.sh"
      - "cells.yaml"
      - "scripts/lvs_tools.py"
      - ".github/workflows/verify.yml"
  pull_request:
    paths:
      - "gds/**"
      - "xschem/**"
      - "scripts/run_drc.sh"
      - "scripts/run_lvs.sh"
      - "scripts/flow.sh"
      - "cells.yaml"
      - "scripts/lvs_tools.py"
      - ".github/workflows/verify.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      cells: ${{ steps.m.outputs.cells }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet pyyaml || true
      - id: m
        # cells.yaml is the registry: a cell is in this matrix when its `stages` contain drc or lvs
        run: echo "cells=$(python3 scripts/cellinfo.py --matrix verify)" >> "$GITHUB_OUTPUT"

  verify:
    needs: plan
    runs-on: ubuntu-latest
    container:
      image: hpretl/iic-osic-tools:2026.09
      options: --user 0
    strategy:
      fail-fast: false
      matrix:
        cell: ${{ fromJSON(needs.plan.outputs.cells) }}
    env:
      PDK: ihp-sg13cmos5l
      PDK_ROOT: /foss/pdks
    steps:
      - uses: actions/checkout@v4

      - name: Make the absolute symbol paths in the schematics resolve
        # instramp_cmos5l.sch references /foss/designs/sg13cmos5l_spma_ip__instramp/xschem/ota_cmos5l/ota_cmos5l.sym
        # (verified: from any other path xschem reports 'ota_cmos5l IS MISSING'). Proper fix: relative references.
        run: |
          mkdir -p /foss/designs
          ln -sfn "$GITHUB_WORKSPACE" /foss/designs/sg13cmos5l_spma_ip__instramp

      - name: Python deps for the cell registry
        run: python3 -m pip install --quiet pyyaml || true

      - name: DRC + antenna + LVS ${{ matrix.cell }}
        # stages and layout path come from cells.yaml; a cell without schematic or layout gets SKIP, not a failure
        id: flow
        continue-on-error: true
        run: scripts/flow.sh ${{ matrix.cell }} --only drc,lvs

      - name: Job summary
        if: always()
        run: |
          { echo "## ${{ matrix.cell }}"; cat docs/${{ matrix.cell }}/status.md 2>/dev/null; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-${{ matrix.cell }}
          path: |
            runs/drc/${{ matrix.cell }}
            runs/lvs/${{ matrix.cell }}
            runs/flow/${{ matrix.cell }}
            netlist/${{ matrix.cell }}/lvs
            docs/${{ matrix.cell }}/status.*
          if-no-files-found: warn

      - name: Fail on DRC / LVS errors
        if: steps.flow.outcome == 'failure'
        run: exit 1
