# Manifest of the CACE parameters of gain_stage.
# scripts/gen_cace.py turns it into cace/gain_stage.yaml from the line `parameters:` on.

sources: {V_AVDD: vdd, I_BIAS: ib, CL: cl, V_VCM: vcm, V_IN: vcm}
params: |
  .param temp=CACE{temperature}
  .param cl=CACE{cl}
  .param ib=CACE{ib}
  .param vdd=CACE{vdd}
  .param vcm=CACE{vcm}
  .param gain_tap=CACE{gain_tap=0}

conditions:
  corner:
    enumerate: [tt, ss, ff, sf, fs]
  vdd:
    minimum: 1.08
    typical: 1.2
    maximum: 1.5
  temperature:
    minimum: -40
    typical: 27
    maximum: 85

parameters:
  ac_gain:
    template: ac.sch
    display: Closed-loop AC gain & bandwidth
    description: Closed-loop inverting gain, gain error vs binary target, -3 dB bandwidth, and 0 dB phase
    conditions:
      gain_tap:
        enumerate: [0, 1, 2, 3, 4, 5]
      corner:
        enumerate: [tt, ss, ff, sf, fs]
      vdd:
        minimum: 1.08
        typical: 1.2
        maximum: 1.5
      temperature:
        minimum: -40
        typical: 27
        maximum: 85
    plots: ["A_CL:temperature", "F3DB:temperature", "A_CL:vdd"]
    spec:
      A_CL:   {display: Closed-loop gain @10 kHz, unit: dB, typ: 0}
      A_ERR:  {display: Gain error vs target, unit: dB, typ: 0}
      F3DB:   {display: -3 dB bandwidth, unit: Hz, min: 20000}
      F0DB:   {display: 0 dB frequency, unit: Hz}
      PH0:    {display: Phase @0 dB, unit: "°"}

  dc_op:
    template: dc_op.sch
    display: DC operating point
    description: Output offset, quiescent current, DC power, and DC output voltage
    conditions:
      gain_tap:
        enumerate: [0, 1, 2, 3, 4, 5]
      corner:
        enumerate: [tt, ss, ff, sf, fs]
      vdd:
        minimum: 1.08
        typical: 1.2
        maximum: 1.5
      temperature:
        minimum: -40
        typical: 27
        maximum: 85
    plots: ["VOS:temperature", "PWR:temperature", "IQ:vdd"]
    spec:
      VOS:        {display: Output offset voltage, unit: mV, typ: 0.013}
      IQ:         {display: Quiescent current, unit: uA, typ: 74, max: 150}
      PWR:        {display: DC power dissipation, unit: uW, typ: 88.6, max: 200}
      VOUT:       {display: DC output voltage, unit: V, typ: 0.6}

  noise:
    template: noise.sch
    display: Noise performance
    description: Input-referred and output noise density, and integrated output noise (referred to VIN)
    conditions:
      gain_tap:
        enumerate: [0, 5]
      corner:
        enumerate: [tt, ss, ff]
      vdd:
        typical: 1.2
      temperature:
        typical: 27
    plots: ["IRN_1K:temperature", "ONOISE_TOT:temperature"]
    spec:
      IRN_10:     {display: Input noise @10 Hz, unit: nV/rtHz}
      IRN_100:    {display: Input noise @100 Hz, unit: nV/rtHz}
      IRN_1K:     {display: Input noise @1 kHz, unit: nV/rtHz, typ: 1500, max: 3500}
      IRN_10K:    {display: Input noise @10 kHz, unit: nV/rtHz}
      ORN_1K:     {display: Output noise @1 kHz, unit: nV/rtHz}
      ONOISE_TOT: {display: Integrated output noise, unit: uV-rms}
      INOISE_EQ:  {display: In-band input noise, unit: uV-rms}

  tran_small:
    template: tran_small.sch
    display: Small-signal step response
    description: Closed-loop transient step gain, overshoot, and settling time for 10 mV input step
    conditions:
      gain_tap:
        enumerate: [0, 1, 2, 3, 4, 5]
      corner:
        enumerate: [tt, ss, ff]
      vdd:
        typical: 1.2
      temperature:
        typical: 27
    plots: ["TR_GAIN:temperature", "SETTLING_TIME:temperature"]
    spec:
      TR_GAIN:       {display: Transient step gain, unit: "", typ: 1.0}
      OVERSHOOT:     {display: Percentage overshoot, unit: "%", typ: 0, max: 20}
      SETTLING_TIME: {display: Settling time (0.1%), unit: us, typ: 0.8, max: 5.0}

  tran_large:
    template: tran_large.sch
    display: Large-signal transient & slew rate
    description: Positive and negative slew rate with 0.4 V pk-pk input step at unity gain (tap 0)
    conditions:
      corner:
        enumerate: [tt, ss, ff]
      vdd:
        typical: 1.2
      temperature:
        typical: 27
    plots: ["SR_POS:temperature", "SR_NEG:temperature"]
    spec:
      SR_POS: {display: Slew rate positive, unit: V/s, min: 1.0e6, typ: 3.0e6}
      SR_NEG: {display: Slew rate negative, unit: V/s, min: 1.0e6, typ: 4.0e6}

  thd:
    template: thd.sch
    display: Total harmonic distortion
    description: THD (harmonics 2..9), 2nd and 3rd harmonic levels for 1 kHz sine with 0.2 V pk-pk output target
    conditions:
      gain_tap:
        enumerate: [0, 1, 2]
      corner:
        enumerate: [tt, ss, ff]
      vdd:
        typical: 1.2
      temperature:
        typical: 27
    plots: ["THD_DB:temperature", "THD_PCT:temperature"]
    spec:
      THD_DB:  {display: THD in dB, unit: dB, typ: -49, max: -20}
      THD_PCT: {display: THD in %, unit: "%", typ: 0.35, max: 10}
      HD2_DB:  {display: 2nd harmonic, unit: dB}
      HD3_DB:  {display: 3rd harmonic, unit: dB}
      VO1:     {display: Fundamental output amplitude, unit: V}

  psrr:
    template: psrr.sch
    display: Power supply rejection ratio
    description: PSRR from AVDD to VOUT across frequency
    conditions:
      gain_tap:
        enumerate: [0, 5]
      corner:
        enumerate: [tt, ss, ff]
      vdd:
        typical: 1.2
      temperature:
        typical: 27
    plots: ["PSRR_DC:temperature", "PSRR_100K:temperature"]
    spec:
      PSRR_DC:   {display: PSRR @10 Hz, unit: dB, min: 25, typ: 37}
      PSRR_100K: {display: PSRR @100 kHz, unit: dB, min: 25, typ: 37}
      PSRR_1M:   {display: PSRR @1 MHz, unit: dB}

  cmrr:
    template: cmrr.sch
    display: Common-mode rejection ratio
    description: CMRR across frequency for VCM
    conditions:
      gain_tap:
        enumerate: [0, 5]
      corner:
        enumerate: [tt, ss, ff]
      vdd:
        typical: 1.2
      temperature:
        typical: 27
    plots: ["CMRR_DC:temperature", "CMRR_100K:temperature"]
    spec:
      CMRR_DC:   {display: CMRR @10 Hz, unit: dB, min: 50, typ: 67}
      CMRR_100K: {display: CMRR @100 kHz, unit: dB, min: 25, typ: 42}
      CMRR_1M:   {display: CMRR @1 MHz, unit: dB}

  tran_switch:
    template: tran_switch.sch
    display: Gain tap switching transient
    description: Output voltage glitch and settling time during binary gain switching
    conditions:
      corner:
        enumerate: [tt, ss, ff]
      vdd:
        typical: 1.2
      temperature:
        typical: 27
    plots: ["V_GLITCH_MAX:temperature", "T_SWITCH_SETTLE:temperature"]
    spec:
      V_GLITCH_MAX:    {display: Max glitch voltage deviation, unit: mV, typ: 50, max: 200}
      T_SWITCH_SETTLE: {display: Gain switching settling time, unit: us, typ: 0.5, max: 3.0}

