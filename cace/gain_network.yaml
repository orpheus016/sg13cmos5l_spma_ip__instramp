#--------------------------------------------------------------
# CACE datasheet: gain_network
#--------------------------------------------------------------

name:           gain_network
description:    Gain OTA network with resistor networks and switches with transmission gates
PDK:            ihp-sg13cmos5l

cace_format:    5.2

authorship:
  designer:         SPMA
  creation_date:    October 22, 2026
  license:          MIT

paths:
  root:             ..
  schematic:        xschem/gain_network
  netlist:          netlist/gain_network
  documentation:    docs/gain_network/cace
  templates:        cace/templates/gain_network

pins:
  AVDD:
    description: Positive analog power supply
    type: power
    direction: inout
    Vmin: 1.08
    Vmax: 1.5
  AVSS:
    description: Analog ground
    type: ground
    direction: inout
  I_BIAS:
    description: Bias current input
    type: signal
    direction: input
  V_CM:
    description: Common-mode input
    type: signal
    direction: input
  V_IN2:
    description: Input signal for instrumentation amplifier in the 1st stage
    type: signal
    direction: input
  V_OUT2:
    description: Output signal to pass onto the next gain stage/output buffer
    type: signal
    direction: output
  S0:
    description: Gain select bit 0 (0 dB / 1x)
    type: signal
    direction: input
  S1:
    description: Gain select bit 1 (+6.02 dB / 2x)
    type: signal
    direction: input
  S2:
    description: Gain select bit 2 (+12.04 dB / 4x)
    type: signal
    direction: input
  S3:
    description: Gain select bit 3 (+18.06 dB / 8x)
    type: signal
    direction: input
  S4:
    description: Gain select bit 4 (+24.08 dB / 16x)
    type: signal
    direction: input
  S5:
    description: Gain select bit 5 (+30.10 dB / 32x)
    type: signal
    direction: input

default_conditions:
  vdd:
    description: Analog power supply voltage
    display: Vdd
    unit: V
    typical: 1.2
  vcm:
    description: Input common mode voltage
    display: Vcm
    unit: V
    typical: 0.6
  ib:
    description: Bias current
    display: Ib
    unit: uA
    typical: 1
  cl:
    description: Output load capacitance
    display: CLoad
    unit: pF
    typical: 2
  gain_tap:
    description: Active binary gain tap (0=0dB to 5=30dB)
    display: Tap
    typical: 0
  corner:
    description: Process corner
    display: Corner
    typical: tt
  rcorner:
    description: Resistor corner (res_<rcorner> section of cornerRES.lib)
    display: Rcorner
    typical: typ
  temperature:
    description: Ambient temperature
    display: Temp
    unit: °C
    typical: 27

# parameters: from here on GENERATED by scripts/gen_cace.py from cace/gain_network.params.yaml - edit the manifest / the testbenches, not this part
parameters:
  ac_gain:
    display: "Closed-loop AC gain & bandwidth"
    description: "Closed-loop inverting gain, gain error vs binary target, -3 dB bandwidth, and 0 dB phase"
    spec:
      A_CL:
        display: "Closed-loop gain @1 kHz"
        unit: "dB"
        minimum:
          value: any
        typical:
          value: 0
        maximum:
          value: any
      A_ERR:
        display: "Gain error vs target"
        unit: "dB"
        minimum:
          value: any
        typical:
          value: 0
        maximum:
          value: any
      F3DB:
        display: "-3 dB bandwidth"
        unit: "Hz"
        minimum:
          value: 20000
        typical:
          value: any
        maximum:
          value: any
      F0DB:
        display: "0 dB frequency"
        unit: "Hz"
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: any
      PH0:
        display: "Phase @0 dB"
        unit: "°"
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: any
    tool:
      ngspice:
        template: ac.sch
        format: ascii
        suffix: .data
        variables: [A_CL, A_ERR, F3DB, F0DB, PH0]
    plot:
      ac_gain_A_CL_vs_temperature:
        type: xyplot
        xaxis: temperature
        yaxis: A_CL
        limits: auto
      ac_gain_F3DB_vs_temperature:
        type: xyplot
        xaxis: temperature
        yaxis: F3DB
        limits: auto
      ac_gain_A_CL_vs_vdd:
        type: xyplot
        xaxis: vdd
        yaxis: A_CL
        limits: auto
    conditions:
      gain_tap:
        enumerate: [0, 1, 2, 3, 4, 5]
      corner:
        enumerate: [tt, ss, ff, sf, fs]
      vdd:
        minimum: 1.08
        typical: 1.2
        maximum: 1.5
      temperature:
        minimum: -40
        typical: 27
        maximum: 85

  dc_op:
    display: "DC operating point"
    description: "Output offset, virtual ground error, quiescent current, and DC power"
    spec:
      VOS:
        display: "Output offset voltage"
        unit: "mV"
        minimum:
          value: any
        typical:
          value: 0.013
        maximum:
          value: any
      V_VG_ERR:
        display: "Virtual ground error"
        unit: "mV"
        minimum:
          value: any
        typical:
          value: 0.012
        maximum:
          value: any
      IQ:
        display: "Quiescent current"
        unit: "uA"
        minimum:
          value: any
        typical:
          value: 74
        maximum:
          value: 150
      PWR:
        display: "DC power dissipation"
        unit: "uW"
        minimum:
          value: any
        typical:
          value: 88.6
        maximum:
          value: 200
      VOUT:
        display: "DC output voltage"
        unit: "V"
        minimum:
          value: any
        typical:
          value: 0.6
        maximum:
          value: any
    tool:
      ngspice:
        template: dc_op.sch
        format: ascii
        suffix: .data
        variables: [VOS, V_VG_ERR, IQ, PWR, VOUT]
    plot:
      dc_op_VOS_vs_temperature:
        type: xyplot
        xaxis: temperature
        yaxis: VOS
        limits: auto
      dc_op_PWR_vs_temperature:
        type: xyplot
        xaxis: temperature
        yaxis: PWR
        limits: auto
      dc_op_IQ_vs_vdd:
        type: xyplot
        xaxis: vdd
        yaxis: IQ
        limits: auto
    conditions:
      gain_tap:
        enumerate: [0, 1, 2, 3, 4, 5]
      corner:
        enumerate: [tt, ss, ff, sf, fs]
      vdd:
        minimum: 1.08
        typical: 1.2
        maximum: 1.5
      temperature:
        minimum: -40
        typical: 27
        maximum: 85

  noise:
    display: "Noise performance"
    description: "Input-referred and output noise density, and integrated output noise (referred to V_IN2)"
    spec:
      IRN_10:
        display: "Input noise @10 Hz"
        unit: "nV/rtHz"
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: any
      IRN_100:
        display: "Input noise @100 Hz"
        unit: "nV/rtHz"
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: any
      IRN_1K:
        display: "Input noise @1 kHz"
        unit: "nV/rtHz"
        minimum:
          value: any
        typical:
          value: 1500
        maximum:
          value: 3500
      IRN_10K:
        display: "Input noise @10 kHz"
        unit: "nV/rtHz"
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: any
      ORN_1K:
        display: "Output noise @1 kHz"
        unit: "nV/rtHz"
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: any
      ONOISE_TOT:
        display: "Integrated output noise"
        unit: "uV-rms"
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: any
      INOISE_EQ:
        display: "In-band input noise"
        unit: "uV-rms"
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: any
    tool:
      ngspice:
        template: noise.sch
        format: ascii
        suffix: .data
        variables: [IRN_10, IRN_100, IRN_1K, IRN_10K, ORN_1K, ONOISE_TOT, INOISE_EQ]
    plot:
      noise_IRN_1K_vs_temperature:
        type: xyplot
        xaxis: temperature
        yaxis: IRN_1K
        limits: auto
      noise_ONOISE_TOT_vs_temperature:
        type: xyplot
        xaxis: temperature
        yaxis: ONOISE_TOT
        limits: auto
    conditions:
      gain_tap:
        enumerate: [0, 5]
      corner:
        enumerate: [tt, ss, ff]
      vdd:
        typical: 1.2
      temperature:
        typical: 27

  tran_small:
    display: "Small-signal step response"
    description: "Small-signal pulse step response (10 mV step on VCM), step gain, settling time, and overshoot"
    spec:
      TR_GAIN:
        display: "Transient step gain"
        unit: ""
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: any
      OVERSHOOT:
        display: "Percentage overshoot"
        unit: "%"
        minimum:
          value: any
        typical:
          value: 2
        maximum:
          value: 20
      SETTLING_TIME:
        display: "Settling time (0.1%)"
        unit: "us"
        minimum:
          value: any
        typical:
          value: 0.8
        maximum:
          value: 5.0
    tool:
      ngspice:
        template: tran_small.sch
        format: ascii
        suffix: .data
        variables: [TR_GAIN, OVERSHOOT, SETTLING_TIME]
    plot:
      tran_small_OVERSHOOT_vs_temperature:
        type: xyplot
        xaxis: temperature
        yaxis: OVERSHOOT
        limits: auto
      tran_small_SETTLING_TIME_vs_temperature:
        type: xyplot
        xaxis: temperature
        yaxis: SETTLING_TIME
        limits: auto
    conditions:
      gain_tap:
        enumerate: [0, 3, 5]
      corner:
        enumerate: [tt, ss, ff]
      vdd:
        typical: 1.2
      temperature:
        typical: 27

  tran_large:
    display: "Large-signal step response (Slew Rate)"
    description: "Large-signal transient response (400 mV step), positive and negative slew rates"
    spec:
      SR_POS:
        display: "Slew rate positive"
        unit: "V/s"
        minimum:
          value: 1.0e6
        typical:
          value: 3.0e6
        maximum:
          value: any
      SR_NEG:
        display: "Slew rate negative"
        unit: "V/s"
        minimum:
          value: 1.0e6
        typical:
          value: 4.0e6
        maximum:
          value: any
    tool:
      ngspice:
        template: tran_large.sch
        format: ascii
        suffix: .data
        variables: [SR_POS, SR_NEG]
    plot:
      tran_large_SR_POS_vs_temperature:
        type: xyplot
        xaxis: temperature
        yaxis: SR_POS
        limits: auto
      tran_large_SR_NEG_vs_temperature:
        type: xyplot
        xaxis: temperature
        yaxis: SR_NEG
        limits: auto
    conditions:
      corner:
        enumerate: [tt, ss, ff, sf, fs]
      vdd:
        minimum: 1.08
        typical: 1.2
        maximum: 1.5
      temperature:
        minimum: -40
        typical: 27
        maximum: 85

  thd:
    display: "Total harmonic distortion (THD)"
    description: "THD (harmonics 2..9) of the closed-loop output for a 1 kHz sine, coherent FFT over 8 periods"
    spec:
      THD_DB:
        display: "THD in dB"
        unit: "dB"
        minimum:
          value: any
        typical:
          value: -49
        maximum:
          value: -20
      THD_PCT:
        display: "THD in %"
        unit: "%"
        minimum:
          value: any
        typical:
          value: 0.35
        maximum:
          value: 10
      HD2_DB:
        display: "2nd harmonic"
        unit: "dB"
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: any
      HD3_DB:
        display: "3rd harmonic"
        unit: "dB"
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: any
      VO1:
        display: "Fundamental output amplitude"
        unit: "V"
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: any
    tool:
      ngspice:
        template: thd.sch
        format: ascii
        suffix: .data
        variables: [THD_DB, THD_PCT, HD2_DB, HD3_DB, VO1]
    plot:
      thd_THD_PCT_vs_temperature:
        type: xyplot
        xaxis: temperature
        yaxis: THD_PCT
        limits: auto
      thd_THD_DB_vs_temperature:
        type: xyplot
        xaxis: temperature
        yaxis: THD_DB
        limits: auto
    conditions:
      gain_tap:
        enumerate: [0, 1, 2, 3, 4, 5]
      corner:
        enumerate: [tt, ss, ff]
      vdd:
        typical: 1.2
      temperature:
        typical: 27

  psrr:
    display: "Power supply rejection ratio (PSRR)"
    description: "Input-referred supply rejection of AVDD = differential gain / AVDD-to-output gain"
    spec:
      PSRR_DC:
        display: "PSRR @10 Hz"
        unit: "dB"
        minimum:
          value: 25
        typical:
          value: 37
        maximum:
          value: any
      PSRR_100K:
        display: "PSRR @100 kHz"
        unit: "dB"
        minimum:
          value: 25
        typical:
          value: 37
        maximum:
          value: any
      PSRR_1M:
        display: "PSRR @1 MHz"
        unit: "dB"
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: any
    tool:
      ngspice:
        template: psrr.sch
        format: ascii
        suffix: .data
        variables: [PSRR_DC, PSRR_100K, PSRR_1M]
    plot:
      psrr_PSRR_DC_vs_temperature:
        type: xyplot
        xaxis: temperature
        yaxis: PSRR_DC
        limits: auto
      psrr_PSRR_100K_vs_temperature:
        type: xyplot
        xaxis: temperature
        yaxis: PSRR_100K
        limits: auto
    conditions:
      gain_tap:
        enumerate: [0, 5]
      corner:
        enumerate: [tt, ss, ff]
      vdd:
        typical: 1.2
      temperature:
        typical: 27

  cmrr:
    display: "Common-mode rejection ratio (CMRR)"
    description: "Input-referred rejection of V_CM reference pin = differential gain / VCM-to-output gain"
    spec:
      CMRR_DC:
        display: "CMRR @10 Hz"
        unit: "dB"
        minimum:
          value: 50
        typical:
          value: 67
        maximum:
          value: any
      CMRR_100K:
        display: "CMRR @100 kHz"
        unit: "dB"
        minimum:
          value: 25
        typical:
          value: 42
        maximum:
          value: any
      CMRR_1M:
        display: "CMRR @1 MHz"
        unit: "dB"
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: any
    tool:
      ngspice:
        template: cmrr.sch
        format: ascii
        suffix: .data
        variables: [CMRR_DC, CMRR_100K, CMRR_1M]
    plot:
      cmrr_CMRR_DC_vs_temperature:
        type: xyplot
        xaxis: temperature
        yaxis: CMRR_DC
        limits: auto
      cmrr_CMRR_100K_vs_temperature:
        type: xyplot
        xaxis: temperature
        yaxis: CMRR_100K
        limits: auto
    conditions:
      gain_tap:
        enumerate: [0, 5]
      corner:
        enumerate: [tt, ss, ff]
      vdd:
        typical: 1.2
      temperature:
        typical: 27

  tran_switch:
    display: "Dynamic gain switching transient & glitch"
    description: "Transient response during sequential gain tap switching (S0 to S1 to S2), measuring peak glitch voltage and settling time"
    spec:
      V_GLITCH_MAX:
        display: "Max glitch voltage deviation"
        unit: "mV"
        minimum:
          value: any
        typical:
          value: 50
        maximum:
          value: 200
      T_SWITCH_SETTLE:
        display: "Gain switching settling time"
        unit: "us"
        minimum:
          value: any
        typical:
          value: 0.5
        maximum:
          value: 3.0
    tool:
      ngspice:
        template: tran_switch.sch
        format: ascii
        suffix: .data
        variables: [V_GLITCH_MAX, T_SWITCH_SETTLE]
    plot:
      tran_switch_V_GLITCH_MAX_vs_temperature:
        type: xyplot
        xaxis: temperature
        yaxis: V_GLITCH_MAX
        limits: auto
      tran_switch_T_SWITCH_SETTLE_vs_temperature:
        type: xyplot
        xaxis: temperature
        yaxis: T_SWITCH_SETTLE
        limits: auto
    conditions:
      corner:
        enumerate: [tt, ss, ff, sf, fs]
      vdd:
        minimum: 1.08
        typical: 1.2
        maximum: 1.5
      temperature:
        minimum: -40
        typical: 27
        maximum: 85
