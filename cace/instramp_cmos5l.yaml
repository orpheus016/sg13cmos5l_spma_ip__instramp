        maximum: 85

  tran_small:
    display: "Small-signal transient"
    description: "1 uV (peak) 10 Hz sine on VINP around Vcm, gain from peak-to-peak over the last 5 periods and the mean output level"
    spec:
      TR_GAIN:
        display: "Small-signal gain (transient)"
        unit: ""
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: any
      TR_VOUT_AVG:
        display: "Mean output level"
        unit: "V"
        minimum:
          value: any
        typical:
          value: any
