# Manifest of the CACE parameters of central_bias.
# scripts/gen_cace.py turns it into cace/central_bias.yaml from the line `parameters:` on.
# The template (cace/templates/central_bias/currents.sch) is written by scripts/make_central_bias_templates.py.
#
# Targets are the currents the pgia_top blocks were verified with (commit 0777ca0: IA 4.2, buffer 1.4, stages 1.0 uA) from 1.0 uA in; the limits are
# +-30 % around what the layout-calibrated mirrors deliver (= the 0.7 .. 1.3 uA window in which all 11 gain codes work, xschem/central_bias/README.md).

params: |
  .param temp=CACE{temperature}
  .param vdd=CACE{vdd}
  .param ib0=CACE{ib0}

conditions:
  corner:
    enumerate: [tt, ss, ff, sf, fs]
  vdd:
    minimum: 1.08
    typical: 1.2
    maximum: 1.5
  temperature:
    minimum: -40
    typical: 27
    maximum: 85
  ib0:
    minimum: 0.7
    typical: 1.0
    maximum: 1.3

parameters:
  currents:
    template: currents.sch
    display: Bias currents
    description: The four bias currents made from the single ibias0 input (loaded with the bias references of the blocks), ratios and supply current
    conditions:
      corner:
        enumerate: [tt, ss, ff, sf, fs]
      vdd:
        minimum: 1.08
        typical: 1.2
        maximum: 1.5
      temperature:
        minimum: -40
        typical: 27
        maximum: 85
      ib0:
        minimum: 0.7
        typical: 1.0
        maximum: 1.3
    plots: ["I_IA:temperature", "I_BUF:temperature", "I_G1:ib0", "R_IA:corner"]
    spec:
      I_IA:   {display: Current into the instrumentation amplifier (sink), unit: uA, typ: 4.4}
      I_BUF:  {display: Current into the output buffer (sink), unit: uA, typ: 1.47}
      I_G1:   {display: Current into gain stage 1 (source), unit: uA, typ: 1.08}
      I_G2:   {display: Current into gain stage 2 (source), unit: uA, typ: 1.08}
      R_IA:   {display: Ratio I_IA / ibias0, unit: A/A, typ: 4.4, min: 3.1, max: 5.7}
      R_BUF:  {display: Ratio I_BUF / ibias0, unit: A/A, typ: 1.47, min: 1.0, max: 1.9}
      R_G:    {display: Ratio I_G / ibias0 (mean of the two stages), unit: A/A, typ: 1.08, min: 0.75, max: 1.4}
      ERR_G:  {display: Stage 1 / stage 2 current difference, unit: "%", typ: 0, min: -3, max: 3}
      PWR:    {display: Supply power of the block (with the loads), unit: uW}

  mc_currents:
    template: currents.sch
    display: MC bias currents
    description: Monte Carlo (local mismatch, 50 seeds x 5 corners x 3 temperatures, vdd 1.2 V, ibias0 1.0 uA)
    collate: iterations
    variables: [I_IA, I_BUF, I_G1, I_G2, R_IA, R_BUF, R_G, ERR_G, null]
    plots: []
    conditions:
      corner:
        enumerate: [tt_mismatch, ss_mismatch, ff_mismatch, sf_mismatch, fs_mismatch]
      rcorner: {typical: typ_mismatch}
      vdd: {typical: 1.2}
      ib0: {typical: 1.0}
      temperature: {minimum: -40, typical: 27, maximum: 85}
      iterations: {description: Monte Carlo iterations (mismatch seeds), display: Iterations, minimum: 1, maximum: 50, step: linear, stepsize: 1}
    spec:
      I_IA:   {display: Current into the instrumentation amplifier (sink), unit: uA}
      I_BUF:  {display: Current into the output buffer (sink), unit: uA}
      I_G1:   {display: Current into gain stage 1 (source), unit: uA}
      I_G2:   {display: Current into gain stage 2 (source), unit: uA}
      R_IA:   {display: Ratio I_IA / ibias0, unit: A/A}
      R_BUF:  {display: Ratio I_BUF / ibias0, unit: A/A}
      R_G:    {display: Ratio I_G / ibias0 (mean of the two stages), unit: A/A}
      ERR_G:  {display: Stage 1 / stage 2 current difference, unit: "%"}
