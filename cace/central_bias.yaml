#--------------------------------------------------------------
# CACE datasheet: central_bias
#--------------------------------------------------------------

name:           central_bias
description:    "Bias generator of pgia_top: the four block bias currents (IA, buffer sunk; gain stages sourced) made from the single harness input ibias0"
PDK:            ihp-sg13cmos5l

cace_format:    5.2

authorship:
  designer:         SPMA
  creation_date:    November 5, 2026
  license:          MIT

paths:
  root:             ..
  schematic:        xschem/central_bias
  netlist:          netlist/central_bias
  documentation:    docs/central_bias/cace
  templates:        cace/templates/central_bias

pins:
  AVDD:
    description: Positive analog power supply (1.2V typ)
    type: power
    direction: inout
    Vmin: 1.08
    Vmax: 1.5
  AVSS:
    description: Analog ground (0V)
    type: ground
    direction: inout
  IB_IN:
    description: Reference input, current SOURCED into the pin (ibias0 of the harness, 1.0 uA nominal, 0.7 .. 1.3 uA window)
    type: signal
    direction: input
  IB_IA:
    description: Bias output SINKING current from the bias reference of the instrumentation amplifier (4.4 uA at 1.0 uA in)
    type: signal
    direction: output
  IB_BUF:
    description: Bias output SINKING current from the bias reference of the output buffer (1.47 uA at 1.0 uA in)
    type: signal
    direction: output
  IB_G1:
    description: Bias output SOURCING current into the bias reference of gain stage 1 (1.08 uA at 1.0 uA in)
    type: signal
    direction: output
  IB_G2:
    description: Bias output SOURCING current into the bias reference of gain stage 2 (1.08 uA at 1.0 uA in)
    type: signal
    direction: output

default_conditions:
  vdd:
    description: Analog power supply voltage
    display: Vdd
    unit: V
    typical: 1.2
  ib0:
    description: Current sourced into IB_IN (ibias0)
    display: Ibias0
    unit: uA
    typical: 1.0
  corner:
    description: Process corner
    display: Corner
    typical: tt
  rcorner:
    description: Resistor corner (res_<rcorner> section of cornerRES.lib)
    display: Rcorner
    typical: typ
  temperature:
    description: Ambient temperature
    display: Temp
    unit: °C
    typical: 27

# parameters: from here on GENERATED by scripts/gen_cace.py from cace/central_bias.params.yaml - edit the manifest / the testbenches, not this part
parameters:
  currents:
    display: "Bias currents"
    description: "The four bias currents made from the single ibias0 input (loaded with the bias references of the blocks), ratios and supply current"
    spec:
      I_IA:
        display: "Current into the instrumentation amplifier (sink)"
        unit: "uA"
        minimum:
          value: any
        typical:
          value: 4.4
        maximum:
          value: any
      I_BUF:
        display: "Current into the output buffer (sink)"
        unit: "uA"
        minimum:
          value: any
        typical:
          value: 1.47
        maximum:
          value: any
      I_G1:
        display: "Current into gain stage 1 (source)"
        unit: "uA"
        minimum:
          value: any
        typical:
          value: 1.08
        maximum:
          value: any
      I_G2:
        display: "Current into gain stage 2 (source)"
        unit: "uA"
        minimum:
          value: any
        typical:
          value: 1.08
        maximum:
          value: any
      R_IA:
        display: "Ratio I_IA / ibias0"
        unit: "A/A"
        minimum:
          value: 3.1
        typical:
          value: 4.4
        maximum:
          value: 5.7
      R_BUF:
        display: "Ratio I_BUF / ibias0"
        unit: "A/A"
        minimum:
          value: 1.0
        typical:
          value: 1.47
        maximum:
          value: 1.9
      R_G:
        display: "Ratio I_G / ibias0 (mean of the two stages)"
        unit: "A/A"
        minimum:
          value: 0.75
        typical:
          value: 1.08
        maximum:
          value: 1.4
      ERR_G:
        display: "Stage 1 / stage 2 current difference"
        unit: "%"
        minimum:
          value: -3
        typical:
          value: 0
        maximum:
          value: 3
      PWR:
        display: "Supply power of the block (with the loads)"
        unit: "uW"
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: any
    tool:
      ngspice:
        template: currents.sch
        format: ascii
        suffix: .data
        variables: [I_IA, I_BUF, I_G1, I_G2, R_IA, R_BUF, R_G, ERR_G, PWR]
    plot:
      currents_I_IA_vs_temperature:
        type: xyplot
        xaxis: temperature
        yaxis: I_IA
        limits: auto
      currents_I_BUF_vs_temperature:
        type: xyplot
        xaxis: temperature
        yaxis: I_BUF
        limits: auto
      currents_I_G1_vs_ib0:
        type: xyplot
        xaxis: ib0
        yaxis: I_G1
        limits: auto
      currents_R_IA_vs_corner:
        type: xyplot
        xaxis: corner
        yaxis: R_IA
        limits: auto
    conditions:
      corner:
        enumerate: [tt, ss, ff, sf, fs]
      vdd:
        minimum: 1.08
        typical: 1.2
        maximum: 1.5
      temperature:
        minimum: -40
        typical: 27
        maximum: 85
      ib0:
        minimum: 0.7
        typical: 1.0
        maximum: 1.3

  mc_currents:
    display: "MC bias currents"
    description: "Monte Carlo (local mismatch, 50 seeds x 5 corners x 3 temperatures, vdd 1.2 V, ibias0 1.0 uA)"
    spec:
      I_IA:
        display: "Current into the instrumentation amplifier (sink)"
        unit: "uA"
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: any
      I_BUF:
        display: "Current into the output buffer (sink)"
        unit: "uA"
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: any
      I_G1:
        display: "Current into gain stage 1 (source)"
        unit: "uA"
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: any
      I_G2:
        display: "Current into gain stage 2 (source)"
        unit: "uA"
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: any
      R_IA:
        display: "Ratio I_IA / ibias0"
        unit: "A/A"
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: any
      R_BUF:
        display: "Ratio I_BUF / ibias0"
        unit: "A/A"
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: any
      R_G:
        display: "Ratio I_G / ibias0 (mean of the two stages)"
        unit: "A/A"
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: any
      ERR_G:
        display: "Stage 1 / stage 2 current difference"
        unit: "%"
        minimum:
          value: any
        typical:
          value: any
        maximum:
          value: any
    tool:
      ngspice:
        template: currents.sch
        collate: iterations
        format: ascii
        suffix: .data
        variables: [I_IA, I_BUF, I_G1, I_G2, R_IA, R_BUF, R_G, ERR_G, null]
    conditions:
      corner:
        enumerate: [tt_mismatch, ss_mismatch, ff_mismatch, sf_mismatch, fs_mismatch]
      rcorner:
        typical: typ_mismatch
      vdd:
        typical: 1.2
      ib0:
        typical: 1.0
      temperature:
        minimum: -40
        typical: 27
        maximum: 85
      iterations:
        description: Monte Carlo iterations (mismatch seeds)
        display: Iterations
        minimum: 1
        maximum: 50
        step: linear
        stepsize: 1
